[project]
name = "rag-ajuste-fino"
version = "0.1.0"
description = "Ajuste fino do modelo de busca (embeddings) de um RAG sobre notas de RPG, medido contra uma prova de perguntas reais."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "sentence-transformers>=5.0",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.uv]
package = false
